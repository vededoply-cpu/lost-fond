<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="50%" stop-color="#ff7800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#c44700" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Card -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#orangeGrad)" filter="url(#dropShadow)" />
  
  <!-- Inner Border Ring -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.3" />
  
  <!-- Center Shield -->
  <path d="M 256 100 Q 370 120 370 240 C 370 330 256 395 256 410 C 256 395 142 330 142 240 Q 142 120 256 100 Z" fill="#ffffff" filter="url(#dropShadow)" />
  
  <!-- Magnifying Glass Icon inside Shield -->
  <circle cx="236" cy="225" r="54" fill="none" stroke="#e65100" stroke-width="20" stroke-linecap="round" />
  <line x1="276" y1="265" x2="330" y2="319" stroke="#e65100" stroke-width="22" stroke-linecap="round" />
  
  <!-- Checkmark for Found -->
  <circle cx="236" cy="225" r="28" fill="#2f9e44" />
  <polyline points="222,225 232,235 252,215" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
