<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Sign In - Lost & Found Portal</title>
    <!-- PWA & Favicon -->
    <link rel="icon" type="image/svg+xml" href="../assets/icons/icon.svg">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            color: #000000 !important;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f15a24;
            color: #000000 !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 14px;
            margin: 0;
        }
        .login-card {
            background: #ffcc80;
            border: 1px solid #000000;
            box-shadow: none;
            border-radius: 8px;
            padding: 36px 28px;
            width: 100%;
            max-width: 420px;
        }
        .login-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 26px;
            color: #000000 !important;
            text-transform: uppercase;
        }
        .btn-login {
            background: #ffb74d;
            color: #000000 !important;
            border: 1px solid #000000;
            box-shadow: none;
            font-weight: 800;
            font-size: 15px;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            transition: 0.2s;
        }
        .btn-login:hover {
            background: #ffa726;
            color: #000000 !important;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid #000000;
            padding: 10px 14px;
            font-size: 15px;
            font-weight: 600;
            color: #000000 !important;
        }
        .form-control:focus {
            background: #ffffff;
            border-color: #000000;
            box-shadow: 0 0 0 0.2rem rgba(0, 0, 0, 0.15);
        }
        .input-group-text {
            background: #ffb74d;
            border: 1px solid #000000;
            border-right: none;
            color: #000000 !important;
        }
        .input-group .form-control {
            border-left: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="login-title mb-1">
            <i class="bi bi-shield-lock-fill me-1"></i> Admin Portal
        </div>
        <div class="small fw-bold opacity-75">Citizen Lost & Found Management</div>
    </div>
    
    <div id="login-alert" class="alert d-none shadow-none fw-bold border-dark"></div>

    <form id="login-form">
        <input type="hidden" name="csrf_token" value="120146fe24d92972c3f6a9b81308ef22f77c09f9f5eace3fa5e4384ce7a56dde">
        
        <div class="mb-3">
            <label for="username" class="form-label fw-bold">Username (उपयोगकर्ता नाम)</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" class="form-control" id="username" name="username" placeholder="superadmin" required>
            </div>
        </div>
        
        <div class="mb-4">
            <label for="password" class="form-label fw-bold">Password (पासवर्ड)</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>
        </div>
        
        <button type="submit" class="btn btn-login">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
        </button>
    </form>
    
    <div class="mt-4 pt-3 border-top border-dark text-center">
        <a href="http://localhost/lost/" class="text-decoration-none fw-bold small">
            <i class="bi bi-arrow-left me-1"></i> Return to Citizen Portal
        </a>
</div>

<div class="text-center mt-3 small fw-bold" style="color: #000000 !important;">
    Design and Developed by <a href="https://edoply.in" target="_blank" rel="noopener" class="text-decoration-underline fw-bold" style="color: #000000 !important;">Edoply Pvt Ltd</a>
</div>

<script>
    const baseUrl = 'http://localhost/lost/';
    
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const alertBox = document.getElementById('login-alert');
        const btn = document.querySelector('.btn-login');

        // Check if browser is offline
        if (!navigator.onLine) {
            alertBox.className = 'alert alert-danger d-block';
            alertBox.innerHTML = '<i class="bi bi-wifi-off me-2"></i> <strong>No Internet Connection:</strong> Please reconnect to your network and try again.';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Authenticating...';
        
        const formData = new FormData(this);
        
        fetch(baseUrl + 'api/auth.php', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('HTTP status ' + response.status);
            }
            return response.json();
        })
        .then(data => {
            if(data.success) {
                alertBox.className = 'alert alert-success d-block';
                alertBox.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i> ' + data.message;
                setTimeout(() => {
                    window.location.href = data.data.redirect;
                }, 800);
            } else {
                alertBox.className = 'alert alert-danger d-block';
                alertBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i> ' + data.message;
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard';
            }
        })
        .catch(error => {
            alertBox.className = 'alert alert-danger d-block';
            if (!navigator.onLine) {
                alertBox.innerHTML = '<i class="bi bi-wifi-off me-2"></i> Internet disconnected. Please reconnect and try again.';
            } else {
                alertBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i> Server connection failed. Please check your network and try again.';
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard';
        });
    });
</script>

</body>
</html>
